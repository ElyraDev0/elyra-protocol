[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
orbinum_testnet = "https://rpc-1.testnet.orbinum.io"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
